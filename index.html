<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad 實時儀表板</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- 頂部時鐘與今日幸運角色 -->
        <header class="clock-card">
            <div class="clock-left">
                <div id="clock-time" class="time-display">--:--:--</div>
                <div id="clock-date" class="date-display">---- - -- - --</div>
            </div>
            <!-- Chiikawa 每日角色卡片 -->
            <div class="chiikawa-box">
                <img id="chiikawa-img" src="" alt="今日角色" />
                <span class="chiikawa-tip">✨ 今日幸運角色 ✨</span>
            </div>
        </header>

        <main class="grid-layout">
            <!-- 天氣資訊卡片 -->
            <section class="card weather-card">
                <div class="card-title">🌸 太古 / 鰂魚涌天氣</div>
                <div class="weather-body">
                    <img id="weather-icon" src="" alt="天氣圖示" class="weather-icon" referrerpolicy="no-referrer" style="display:none;">
                    <div class="temp-display"><span id="weather-temp">--</span>°C</div>
                </div>
                <div id="weather-warning" class="warning-box">載入天氣警告中...</div>
            </section>

            <!-- 交通報站卡片 -->
            <section class="card transport-card">
                <div class="card-title">🚃 港鐵太古站 (TAK) 實時到站</div>
                <div class="mtr-routes">
                    <div class="route-item">
                        <span class="direction">往 堅尼地城：</span>
                        <span id="mtr-down" class="eta-time">載入中...</span>
                    </div>
                    <div class="route-item">
                        <span class="direction">往 柴灣：</span>
                        <span id="mtr-up" class="eta-time">載入中...</span>
                    </div>
                </div>

                <div class="card-title bus-title">🚌 指定巴士路線實時到站</div>
                <div class="bus-list">
                    <div class="route-item">
                        <span class="direction">A12（機場方向）：</span>
                        <span id="bus-a12-eta" class="eta-time">載入中...</span>
                    </div>
                    <div class="route-item">
                        <span class="direction">33X（數碼港方向）：</span>
                        <span id="bus-33x-eta" class="eta-time">載入中...</span>
                    </div>
                </div>
            </section>

            <!-- 溫馨備忘板卡片 -->
            <section class="card memo-card">
                <div class="memo-header">
                    <div class="card-title memo-title">📝 每日溫馨備忘</div>
                    <span id="memo-status" class="memo-status">自動儲存中</span>
                </div>
                <textarea id="memo-input" class="memo-textarea" placeholder="點擊這裡輸入提醒事項（如：記得餵主子、帶雨傘出門...）"></textarea>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
