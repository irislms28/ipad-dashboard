<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>太古 Dashboard</title>
  <style>
    :root {
      --bg-color: #f7f9fc;
      --card-bg: #ffffff;
      --primary-color: #0077b6;
      --accent-pink: #ff6b81;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #edf2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f8; color: var(--text-main); padding: 20px; height: 100vh; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); }
    .time-container { display: flex; align-items: baseline; gap: 15px; }
    .clock { font-size: 3.2rem; font-weight: 800; color: var(--primary-color); line-height: 1; }
    .date { font-size: 1.5rem; font-weight: 600; color: var(--accent-pink); }
    .refresh-btn { background: #e2e8f0; color: #4a5568; border: none; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }

    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex: 1; }
    .card { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; }

    .weather-main { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
    .temp-box { font-size: 4rem; font-weight: 800; color: #ff9f1c; }
    .weather-icon img { width: 90px; height: 90px; object-fit: contain; }
    .weather-desc { margin-top: auto; background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; font-size: 1rem; font-weight: 600; color: var(--text-sub); }

    .eta-box { background: #f8fafc; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 6px solid var(--primary-color); }
    .route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .route-badge { background: var(--primary-color); color: white; padding: 3px 10px; border-radius: 8px; font-weight: bold; font-size: 1rem; }
    .destination { font-size: 1.1rem; font-weight: 700; }
    .eta-time { font-size: 2rem; font-weight: 800; color: var(--primary-color); text-align: right; }
    .eta-unit { font-size: 1rem; font-weight: 600; }
    .next-bus { font-size: 0.9rem; color: var(--text-sub); margin-top: 4px; text-align: right; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="time-container">
      <div id="clock" class="clock">--:--:--</div>
      <div id="date" class="date">--月--日 (星期-)</div>
    </div>
    <button class="refresh-btn" onclick="fetchAllData()">↻ 刷新數據</button>
  </div>

  <div class="grid-container">
    <!-- 天氣區域 -->
    <div class="card">
      <div class="card-title">☀️ 太古即時天氣</div>
      <div class="weather-main">
        <div class="temp-box" id="temp">--°</div>
        <div class="weather-icon" id="weather-icon"></div>
      </div>
      <div class="weather-desc" id="weather-desc">加載中...</div>
    </div>

    <!-- 到站時間區域 -->
    <div class="card">
      <div class="card-title">🚌 實時到站時間</div>
      
      <!-- 港鐵 MTR API -->
      <div class="eta-box" style="border-left-color: #0072ce;">
        <div class="route-header">
          <span class="route-badge" style="background: #0072ce;">港島綫</span>
          <span class="destination">太古 往 堅尼地城</span>
        </div>
        <div class="eta-time" id="mtr-eta">-- <span class="eta-unit">分鐘</span></div>
        <div class="next-bus" id="mtr-next">下班車：--</div>
      </div>

      <!-- 城巴 CTB API -->
      <div class="eta-box" style="border-left-color: #e63946;">
        <div class="route-header">
          <span class="route-badge" style="background: #e63946;">33X</span>
          <span class="destination">康怡廣場 往 數碼港</span>
        </div>
        <div class="eta-time" id="bus-eta">-- <span class="eta-unit">分鐘</span></div>
        <div class="next-bus" id="bus-next">下班車：--</div>
      </div>
    </div>
  </div>

  <script>
    // 1. 時間更新
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      document.getElementById('date').innerText = `${now.getMonth() + 1}月${now.getDate()}日 (星期${weekDays[now.getDay()]})`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 格式化日期，避免 iOS/Safari 遇到 Invalid Date
    function parseCustomDate(dateStr) {
      if (!dateStr) return null;
      return new Date(dateStr.replace(/-/g, '/').replace('T', ' '));
    }

    // 2. 香港天文台 Weather API
    async function getWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        
        const taikooTemp = data.temperature.data.find(t => t.place === "鰂魚涌") || data.temperature.data[0];
        document.getElementById('temp').innerText = `${taikooTemp.value}°C`;
        
        if (data.icon && data.icon.length > 0) {
          const iconCode = data.icon[0];
          document.getElementById('weather-icon').innerHTML = `<img src="https://www.hko.gov.hk/images/HKOWeatherIcon/pic${iconCode}.png" alt="weather">`;
        }
        document.getElementById('weather-desc').innerText = `位置：鰂魚涌 / 太古`;
      } catch (e) {
        document.getElementById('weather-desc').innerText = "天氣加載失敗";
      }
    }

    // 3. MTR API 官方接口: rt.data.gov.hk/v1/transport/mtr/getSchedule.php
    async function getMTRETA() {
      try {
        const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=ISL&sta=TAK');
        const data = await res.json();
        
        if (data.status === 1 && data.data && data.data['ISL-TAK'] && data.data['ISL-TAK'].W) {
          const list = data.data['ISL-TAK'].W;
          if (list.length > 0) {
            const now = new Date();
            const firstTrain = parseCustomDate(list[0].time);
            const diffMin = Math.max(0, Math.floor((firstTrain - now) / 60000));
            
            document.getElementById('mtr-eta').innerHTML = `${diffMin} <span class="eta-unit">分鐘</span>`;
            
            if (list[1]) {
              const secondTrain = parseCustomDate(list[1].time);
              const nextMin = Math.max(0, Math.floor((secondTrain - now) / 60000));
              document.getElementById('mtr-next').innerText = `下一班：${nextMin} 分鐘`;
            }
          } else {
            document.getElementById('mtr-eta').innerText = "尾班車已過";
          }
        }
      } catch (e) {
        document.getElementById('mtr-eta').innerText = "獲取失敗";
      }
    }

    // 4. 城巴 CTB API 官方接口: rt.data.gov.hk/v2/transport/citybus/eta/CTB/001322/33X
    async function getBusETA() {
      try {
        const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/001322/33X');
        const data = await res.json();
        
        if (data.data && data.data.length > 0) {
          // 過濾有效班次
          const list = data.data.filter(item => item.eta && item.eta !== "");
          if (list.length > 0) {
            const now = new Date();
            const firstBus = parseCustomDate(list[0].eta);
            const diffMin = Math.max(0, Math.floor((firstBus - now) / 60000));
            
            document.getElementById('bus-eta').innerHTML = `${diffMin} <span class="eta-unit">分鐘</span>`;
            
            if (list[1]) {
              const secondBus = parseCustomDate(list[1].eta);
              const nextMin = Math.max(0, Math.floor((secondBus - now) / 60000));
              document.getElementById('bus-next').innerText = `下一班：${nextMin} 分鐘`;
            }
          } else {
            document.getElementById('bus-eta').innerText = "非服務時間";
            document.getElementById('bus-next').innerText = "僅限早上繁忙時間服務";
          }
        } else {
          document.getElementById('bus-eta').innerText = "非服務時間";
          document.getElementById('bus-next').innerText = "僅限早上繁忙時間服務";
        }
      } catch (e) {
        document.getElementById('bus-eta').innerText = "獲取失敗";
      }
    }

    function fetchAllData() {
      getWeather();
      getMTRETA();
      getBusETA();
    }

    fetchAllData();
    setInterval(fetchAllData, 30000); // 30 秒自動刷新
  </script>
</body>
</html>
